apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-application
spec:
  selector:
    matchLabels:
      app: hpa-application
  template:
    metadata:
      labels:
        app: hpa-application
    spec:
      containers:
      - name: hpa-application
        image: hpa:v1
        imagePullPolicy: Never
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: hpa-svc
spec:
  selector:
    app: hpa-application
  ports:
  - port: 5000
    targetPort: 5000
