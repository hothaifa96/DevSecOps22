apiVersion: apps/v1
kind: Deployment
metadata:
  name: joke-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: joke-api
  template:
    metadata:
      labels:
        app: joke-api
    spec:
      containers:
        - name: joke-api
          image: joke-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: joke-api
spec:
  type: NodePort
  selector:
    app: joke-api
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080